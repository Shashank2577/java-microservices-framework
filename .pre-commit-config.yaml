# Pre-commit hooks. Install with:
#   pip install pre-commit
#   pre-commit install
# See `.claude/skills/java-code-quality/SKILL.md` §14.

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']

  - repo: local
    hooks:
      - id: framework-validator
        name: Framework cross-skill consistency
        entry: python3 tools/validate_framework.py --quiet
        language: system
        files: '\.(md|json|toml)$|tools/validate_framework\.py$'
        pass_filenames: false
